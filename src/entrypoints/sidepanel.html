<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Default Side Panel Title</title>

    <!-- Customize the manifest options -->
    <meta
      name="manifest.default_icon"
      content="{
        16: '/icon-16.png',
        24: '/icon-24.png',
        ...
      }"
    />
    <meta name="manifest.open_at_install" content="true" />
    <meta name="manifest.browser_style" content="true" />

    <!-- Set include/exclude if the page should be removed from some builds -->
    <!-- --
    <meta name="manifest.include" content="['chrome', ...]" />
    <meta name="manifest.exclude" content="['chrome', ...]" />
    -->
    <style type="text/css">
      html {
        overflow: auto;
      }
      html,
      body,
      div,
      iframe {
        margin: 0px;
        padding: 0px;
        height: 100%;
        border: none;
      }
      iframe {
        display: block;
        width: 100%;
        border: none;
        overflow-y: auto;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <iframe
      id="treasury-ui"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      width="100%"
      height="100%"
      scrolling="auto"
      title="embedded UI"
      allow="publickey-credentials-get *; clipboard-write *"
    ></iframe>

    <script type="module">
      const ui = "%VITE_UI%";
      const uiOrigin = new URL(ui).origin;
      const iframeSrc = `${ui}defi?defi=fullscreen`;
      const ownTabIdValue = Number(
        new URLSearchParams(window.location.search).get("tabId"),
      );
      const ownTabId = Number.isSafeInteger(ownTabIdValue)
        ? ownTabIdValue
        : null;
      const navigateRetryDelays = [0, 150, 500, 1000, 2000, 4000];
      let pendingNavigateContext = null;
      let navigateRetryTimers = [];

      function proposalFromContext(context) {
        return context?.proposalName;
      }

      function clearNavigateRetryTimers() {
        for (const timer of navigateRetryTimers) {
          window.clearTimeout(timer);
        }
        navigateRetryTimers = [];
      }

      function hasNavigationPayload(context) {
        return !!(
          context?.addExtensionOrigin ||
          context?.proposalName ||
          context?.treasuryId
        );
      }

      function normalizeNavigationContext(value) {
        if (
          typeof value !== "object" ||
          value === null ||
          value.kind !== "cordial:defi:navigate-context"
        ) {
          return null;
        }

        const context = {
          kind: "cordial:defi:navigate-context",
        };

        if (typeof value.proposalName === "string") {
          context.proposalName = value.proposalName;
        }

        if (typeof value.treasuryId === "string") {
          context.treasuryId = value.treasuryId;
        }

        if (typeof value.addExtensionOrigin === "string") {
          try {
            const parsed = new URL(value.addExtensionOrigin);
            if (parsed.protocol === "http:" || parsed.protocol === "https:") {
              context.addExtensionOrigin = parsed.origin;
            }
          } catch {
            // Ignore invalid add-origin hints.
          }
        }

        return context;
      }

      function postNavigateContext(context) {
        const iframe = document.getElementById("treasury-ui");
        if (!(iframe instanceof HTMLIFrameElement) || !iframe.contentWindow) {
          return false;
        }

        console.info(
          "[cordial-extension:sidepanel] post-navigate-context",
          context,
        );
        iframe.contentWindow.postMessage(context, uiOrigin);
        return true;
      }

      function scheduleNavigateContext(context) {
        pendingNavigateContext = hasNavigationPayload(context) ? context : null;
        clearNavigateRetryTimers();

        if (!pendingNavigateContext) {
          return;
        }

        for (const delay of navigateRetryDelays) {
          const timer = window.setTimeout(() => {
            if (!pendingNavigateContext) {
              return;
            }
            postNavigateContext(pendingNavigateContext);
          }, delay);
          navigateRetryTimers.push(timer);
        }
      }

      function navigateToDefi() {
        const iframe = document.getElementById("treasury-ui");
        if (iframe instanceof HTMLIFrameElement) {
          iframe.src = iframeSrc;
        }
      }

      function isNavigationForCurrentTab(message) {
        if (typeof message.tabId !== "number") {
          return true;
        }

        return ownTabId === message.tabId;
      }

      async function handleNavigateMessage(message) {
        if (!isNavigationForCurrentTab(message)) {
          console.info("[cordial-extension:sidepanel] ignored-navigate", {
            ownTabId,
            tabId: message.tabId,
          });
          return;
        }

        const context = normalizeNavigationContext(message.context);
        if (!context) {
          return;
        }

        console.info("[cordial-extension:sidepanel] navigate", {
          proposalName: proposalFromContext(context),
          tabId: message.tabId,
        });
        if (postNavigateContext(context)) {
          scheduleNavigateContext(context);
        } else {
          navigateToDefi();
          scheduleNavigateContext(context);
        }
      }

      async function loadPendingNavigation() {
        if (ownTabId === null) {
          return;
        }

        const context = await browser.runtime
          .sendMessage({
            kind: "cordial:sidepanel:get-navigation",
            tabId: ownTabId,
          })
          .then(normalizeNavigationContext)
          .catch((error) => {
            console.info(
              "[cordial-extension:sidepanel] get-navigation-failed",
              {
                error: error instanceof Error ? error.message : String(error),
                tabId: ownTabId,
              },
            );
            return null;
          });

        if (context) {
          scheduleNavigateContext(context);
        }
      }

      const iframe = document.getElementById("treasury-ui");
      if (iframe instanceof HTMLIFrameElement) {
        iframe.addEventListener("load", () => {
          if (!pendingNavigateContext) {
            return;
          }
          postNavigateContext(pendingNavigateContext);
        });
      }

      navigateToDefi();
      void loadPendingNavigation();

      window.addEventListener("message", (event) => {
        if (event.origin !== uiOrigin) {
          return;
        }

        if (!event.data) {
          return;
        }

        if (event.data.kind === "cordial:defi:get-navigate-context") {
          console.info("[cordial-extension:sidepanel] get-navigate-context", {
            hasPendingContext: !!pendingNavigateContext,
            ownTabId,
          });
          if (pendingNavigateContext) {
            postNavigateContext(pendingNavigateContext);
          }
          return;
        }

        if (event.data.kind === "cordial:defi:config-updated") {
          browser.runtime.sendMessage({
            kind: "cordial:extension:config-updated",
          });
        }

        if (event.data.kind === "cordial:defi:proposal-canceled") {
          console.info("[cordial-extension:sidepanel] proposal-canceled", {
            proposalName: event.data.proposalName,
          });
          browser.runtime.sendMessage({
            kind: "cordial:extension:proposal-canceled",
            proposalName: event.data.proposalName,
          });
        }
      });

      browser.runtime.onMessage.addListener((message) => {
        if (!message) {
          return;
        }

        if (message.kind === "cordial:sidepanel:login-complete") {
          navigateToDefi();
          void loadPendingNavigation();
          return;
        }

        if (message.kind !== "cordial:sidepanel:navigate") {
          return;
        }

        void handleNavigateMessage(message);
      });
    </script>
  </body>
</html>
